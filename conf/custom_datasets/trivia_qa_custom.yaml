version_2_with_negative: False
test:
    _target_: src.custom_datasets.llama31_dataset_custom.Llama31DatasetCustom
    split: "test"
    data_config:
        prompt: "Answer the question based on the given passage. Only give me the answer and do not output any other words. The following are some examples.\n\n{context}\n\n{input}"
        question_prompt: null
        question_column: "input"
        context_column: "context"
        answer_column: "answers"
        id_column: "_id"
        use_fp16: False
        dataset_name: null
        pad_to_max_length: False
        max_length: 2048 # must fit the full input field (passage+question+Answer:), max observed ~1870 tokens
        max_answer_length: 32
        dataset_config_name: null
        train_file: null
        validation_file: null
        test_file: "data/longbench_v1/triviaqa.jsonl"
        question_max_length: 2500
        context_max_length: 128000 # avg context length for triviaqa
        use_rag: False
        completion_mode: True  # raw text continuation (no chat role headers), matching FastKV/LongBench official eval
        extract_question_from_input: True  # input field contains "Passage:\n...\nQuestion:\nXXX\nAnswer:", extract only the question for FINCH condition
