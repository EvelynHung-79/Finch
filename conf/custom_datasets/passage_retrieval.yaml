version_2_with_negative: False
test:
    _target_: src.custom_datasets.llama31_dataset_custom.Llama31DatasetCustom
    split: "test"
    data_config:
        prompt: "Here are 30 paragraphs from Wikipedia, along with an abstract. Please determine which paragraph the abstract is from.\n\n{context}\n\nThe following is an abstract.\n\n{input}\n\nPlease enter the number of the paragraph that the abstract is from. The answer format must be like \"Paragraph 1\", \"Paragraph 2\", etc.\n\nThe answer is: "
        question_prompt: null
        question_column: "input"
        context_column: "context"
        answer_column: "answers"
        id_column: "_id"
        use_fp16: False
        dataset_name: null
        pad_to_max_length: False
        max_length: 512 # length of system prompt + question (not full sequence)
        max_answer_length: 32
        dataset_config_name: null
        train_file: null
        validation_file: null
        test_file: "data/longbench_v1/passage_retrieval_en.jsonl"
        question_max_length: 512
        context_max_length: 128000 # avg context length for passage_retrieval_en
        use_rag: False
