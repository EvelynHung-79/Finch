        context_column: "context"
        answer_column: "answers"
        id_column: "_id"
        use_fp16: False
        dataset_name: null
        pad_to_max_length: False
        max_length: 512 # length of system prompt + question (not full sequence)
        max_answer_length: 32
        dataset_config_name: null
        train_file: null
        validation_file: null
        test_file: "data/longbench_v1/passage_count.jsonl"
        question_max_length: 256
        context_max_length: 128000 # avg context length for passage_count
        use_rag: False
